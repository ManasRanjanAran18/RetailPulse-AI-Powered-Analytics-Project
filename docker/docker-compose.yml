# Local full stack:
#   docker compose -f docker/docker-compose.yml up --build dashboard mlflow
#   docker compose -f docker/docker-compose.yml --profile train run --rm trainer   # retrain + log to MLflow
#
# Dashboard -> http://localhost:8501      MLflow UI -> http://localhost:5000
services:
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    image: retailpulse-dashboard:latest
    ports:
      - "8501:8501"
    restart: unless-stopped

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    image: retailpulse-mlflow:latest
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow/data
    restart: unless-stopped

  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    image: retailpulse-train:latest
    profiles: ["train"]          # only runs when requested explicitly
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      - mlflow
    volumes:
      - ../data/processed:/app/data/processed
      - ../models:/app/models
      - ../reports:/app/reports

volumes:
  mlflow-data:
