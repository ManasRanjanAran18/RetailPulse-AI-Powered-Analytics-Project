name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest==9.1.1
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Pipeline smoke test (light mode)
        run: python scripts/run_pipeline.py --light
      - name: Dashboard smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          for page in ["Demand forecast", "Customer segments", "Churn risk", "Inventory", "Monitoring"]:
              at.sidebar.radio[0].set_value(page).run()
              assert not at.exception, (page, [e.value for e in at.exception])
          print("dashboard OK")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dashboard image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: retailpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
