# Weekly retraining job (Sunday 02:00 UTC). Logs every run to the in-cluster MLflow server.
# For production, write artifacts to shared storage (S3/GCS/PVC) and roll the dashboard afterwards.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retailpulse-retrain
  namespace: retailpulse
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trainer
              image: ghcr.io/YOUR_GITHUB_USERNAME/retailpulse-analytics-train:latest
              env:
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow:5000
              resources:
                requests: { cpu: "1", memory: 2Gi }
                limits: { cpu: "2", memory: 4Gi }
