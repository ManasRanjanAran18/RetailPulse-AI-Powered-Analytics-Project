# MLflow tracking server with a persistent volume (SQLite backend; use Postgres for production).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: retailpulse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: retailpulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/YOUR_GITHUB_USERNAME/retailpulse-analytics-mlflow:latest
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /mlflow/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: retailpulse
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
